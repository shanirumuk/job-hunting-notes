<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice application · Job Notebook</title>
<style>body{font:17px system-ui;max-width:540px;margin:20px auto;padding:16px;color:#302b31}label{display:block;margin:18px 0}input,textarea{display:block;width:100%;box-sizing:border-box;padding:12px;font:inherit}input[type=checkbox]{display:inline;width:auto}button{font:inherit;padding:14px}aside{background:#fff0cf;padding:16px;border-radius:12px}</style>
<aside>Practice only. This form does not send an application or upload files to a server.</aside><h1>Job Notebook Practice</h1><h2>Implementation Consultant</h2>
<form id="practice-form"><label>First name<input name="first_name" required></label><label>Last name<input name="last_name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" type="tel"></label><label>LinkedIn profile<input name="linkedin" type="url"></label><label>Resume / CV<input name="resume" type="file" accept=".pdf" required></label><label>Why this role?<textarea name="motivation"></textarea></label><label><input name="consent" type="checkbox" required> I have reviewed this practice application</label><button>Finish practice review</button><p id="result" role="status"></p></form>
<script>window.practiceSubmitted=false;document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();window.practiceSubmitted=true;document.querySelector('#result').textContent='Practice review complete. Nothing was sent.';});</script></html>
